<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Consultar Dados Cadastrais</title>
        <meta charset="UTF-8", name="viewport", content="width=device-width, initial-scale=1.0">
        <!-- Bootstrap CSS and JS  -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
        <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        </head>
    <body>
        <div class="container-xl w-100 d-flex flex-column justify-content-center align-items-center" >
            <div class="p-2">
                <h1>Consultar Dados Cadastrais</h1>
            </div>
            <div class="p-2 w-50 d-flex justify-content-center">
                <form method="post" action="/consultar-dados-cadastrais" class="p-4 p-md-5 d-flex flex-column align-items-center w-75 border rounded-3 bg-1">
                    <div class="d-flex flex-row">
                    <div class="form-field p-3">
                        <input class="radio" name="radios" type="radio" value="cnpj" id="cnpj_radio" checked>
                        <label for="cnpj_radio">CNPJ</label>
                    </div>
                    <div class="form-field p-3">
                        <input class="radio" name="radios" type="radio" value="cpf" id="cpf_radio">
                        <label for="cpf_radio">CPF</label>
                    </div>
                    </div>
                    <div class="form-field w-50">
                        <label for="cnpj" class="form-label">CNPJ:</label>
                        <input type="text" id="cnpj" name="cnpj" class="form-control" required><br><br>
                    </div>
                    <div class="form-field w-50">
                        <label for="im" class="form-label">Inscrição Municipal:</label>
                        <input type="text" id="im" name="im" class="form-control" required><br><br>
                    </div>
                    <div class="d-flex flex-row justify-content-center">
                      <input type="submit" class="btn-solid theme-primary" value="Consultar">
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
